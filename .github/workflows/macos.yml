name: macOS tests

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  arm64:
    name: Native arm64 / Python 3.11
    runs-on: macos-15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11 arm64
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          architecture: arm64

      - name: Verify native architecture and Python version
        shell: bash
        run: |
          test "$(uname -m)" = "arm64"
          python -c 'import platform, sys; print(sys.version); print(platform.machine()); assert platform.machine() == "arm64"; assert sys.version_info[:2] == (3, 11)'

      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Check dependencies
        run: python -m pip check

      - name: Run existing tests
        env:
          QT_QPA_PLATFORM: offscreen
          SDL_AUDIODRIVER: dummy
          SDL_VIDEODRIVER: dummy
        run: python -m pytest -q

      - name: Build and validate macOS application
        shell: bash
        run: |
          set -Eeuo pipefail
          trap 'printf "Build or validation failed at line %s: %s\n" "$LINENO" "$BASH_COMMAND" >&2; ls -la dist/macos/arm64 dist/macos/arm64/Jingleplayer.app/Contents dist/macos/arm64/Jingleplayer.app/Contents/MacOS >&2 || true' ERR
          bash build_macos.sh
          app="dist/macos/arm64/Jingleplayer.app"
          executable="$app/Contents/MacOS/Jingleplayer"
          test -d "$app"
          test -f "$executable"
          test -x "$executable"
          plutil -lint "$app/Contents/Info.plist"
          file "$executable"
          lipo -archs "$executable"
          lipo "$executable" -verify_arch arm64

  x86_64:
    name: Native x86_64 / Python 3.11
    runs-on: macos-15-intel
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11 x64
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          architecture: x64

      - name: Verify native architecture and Python version
        shell: bash
        run: |
          test "$(uname -m)" = "x86_64"
          python -c 'import platform, sys; print(sys.version); print(platform.machine()); assert platform.machine() == "x86_64"; assert sys.version_info[:2] == (3, 11)'

      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Check dependencies
        run: python -m pip check

      - name: Run existing tests
        env:
          QT_QPA_PLATFORM: offscreen
          SDL_AUDIODRIVER: dummy
          SDL_VIDEODRIVER: dummy
        run: python -m pytest -q

      - name: Build and validate macOS application
        shell: bash
        run: |
          set -Eeuo pipefail
          trap 'printf "Build or validation failed at line %s: %s\n" "$LINENO" "$BASH_COMMAND" >&2; ls -la dist/macos/x86_64 dist/macos/x86_64/Jingleplayer.app/Contents dist/macos/x86_64/Jingleplayer.app/Contents/MacOS >&2 || true' ERR
          bash build_macos.sh
          app="dist/macos/x86_64/Jingleplayer.app"
          executable="$app/Contents/MacOS/Jingleplayer"
          test -d "$app"
          test -f "$executable"
          test -x "$executable"
          plutil -lint "$app/Contents/Info.plist"
          file "$executable"
          lipo -archs "$executable"
          lipo "$executable" -verify_arch x86_64
